<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Velocity Noir</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0; left: 0;
    }
    #ui-layer {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: 'Courier New', monospace;
    }
    #loading-screen .logo {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 0.3em;
      color: #ff4400;
      text-shadow: 0 0 30px #ff4400, 0 0 60px #ff2200;
      animation: pulse 1.5s ease-in-out infinite;
      margin-bottom: 2rem;
    }
    #loading-screen .subtitle {
      color: #888;
      letter-spacing: 0.5em;
      font-size: 0.7rem;
      margin-bottom: 3rem;
      text-transform: uppercase;
    }
    #loading-bar-wrap {
      width: 300px;
      height: 2px;
      background: #111;
      border: 1px solid #333;
    }
    #loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4400, #ff8800);
      box-shadow: 0 0 10px #ff4400;
      transition: width 0.1s linear;
    }
    #loading-text {
      color: #444;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      margin-top: 1rem;
      text-transform: uppercase;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-Bk8yz9DS.js"></script>

  <link rel="modulepreload" crossorigin href="./assets/game-BTQ_ODn8.js">

<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="logo">VELOCITY NOIR</div>
    <div class="subtitle">Street Racing · No Rules · No Mercy</div>
    <div id="loading-bar-wrap">
      <div id="loading-bar"></div>
    </div>
    <div id="loading-text">Initializing engine...</div>
  </div>

  <!-- WebGL Canvas (main render target) -->
  <canvas id="game-canvas"></canvas>

  <!-- UI Overlay Layer (HUD, menus) -->
  <div id="ui-layer"></div>

  <!-- Boot -->
</body>
